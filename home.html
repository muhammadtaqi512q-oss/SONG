<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TAQI Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            color: #202124;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Browser Toolbar */
        .browser-toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            border-bottom: 1px solid #dadce0;
            gap: 8px;
            flex-shrink: 0;
            height: 52px;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #5f6368;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #e8eaed;
        }

        .address-bar-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f1f3f4;
            border-radius: 20px;
            padding: 0 14px;
            height: 38px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .address-bar-wrapper:focus-within {
            background: #ffffff;
            border-color: #dadce0;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        }

        .top-t-logo {
            width: 20px;
            height: 20px;
            background: #003366;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .top-url-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: #3c4043;
        }

        /* Homepage View */
        .viewport-container {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .brand-title {
            font-size: 78px;
            font-weight: 700;
            color: #003366;
            letter-spacing: -2px;
            margin-bottom: 24px;
            user-select: none;
        }

        .center-search-wrapper {
            width: 560px;
            max-width: 90vw;
            position: relative;
        }

        .center-search-input {
            width: 100%;
            height: 48px;
            padding: 0 20px 0 48px;
            font-size: 16px;
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            color: #202124;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.1);
            transition: all 0.2s ease;
        }

        .center-search-input:hover, .center-search-input:focus {
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            border-color: transparent;
        }

        .search-glass-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: #5f6368;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Browser Toolbar -->
    <div class="browser-toolbar">
        <div class="nav-icons">
            <button class="nav-btn" onclick="location.reload()" title="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
        </div>

        <div class="address-bar-wrapper">
            <div class="top-t-logo">T</div>
            <input type="text" id="urlInput" class="top-url-input" placeholder="Search TAQI or type a URL">
        </div>
    </div>

    <!-- Main Homepage Viewport -->
    <div class="viewport-container">
        <div class="brand-title">TAQI</div>
        <div class="center-search-wrapper">
            <svg class="search-glass-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" id="centerSearch" class="center-search-input" placeholder="Search TAQI Database or type URL..." autofocus>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const centerSearch = document.getElementById('centerSearch');

        function processQuery(query) {
            query = query.trim();
            if (!query) return;

            let lowerQuery = query.toLowerCase();
            let targetUrl = '';

            if (lowerQuery === 'nexura' || lowerQuery === 'nexura search' || lowerQuery.includes('nexura')) {
                targetUrl = 'https://nexura.oneapp.dev';
            } else if (lowerQuery === 'taqi' || lowerQuery === 'taqi search' || lowerQuery.includes('taqi')) {
                targetUrl = 'https://taqi.oneapp.dev';
            } else if (query.startsWith('http://') || query.startsWith('https://')) {
                targetUrl = query;
            } else if (query.includes('.') && !query.includes(' ')) {
                targetUrl = 'https://' + query;
            } else {
                targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            }

            urlInput.value = targetUrl;

            // Open via Cordova InAppBrowser to bypass X-Frame-Options restriction completely
            if (window.cordova && cordova.InAppBrowser) {
                let browserWindow = cordova.InAppBrowser.open(targetUrl, '_blank', 'location=yes,toolbar=yes');
            } else {
                // Fallback for desktop testing browser
                window.location.href = targetUrl;
            }
        }

        centerSearch.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') processQuery(this.value);
        });

        urlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') processQuery(this.value);
        });
    </script>
</body>
</html>
