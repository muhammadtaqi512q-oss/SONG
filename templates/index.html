<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music API Tester</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #1db954;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #1db954;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1db954;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1aa34a;
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 6px;
            display: none;
            text-align: left;
            word-wrap: break-word;
        }
        .result-box a {
            color: #1db954;
            text-decoration: none;
            font-weight: bold;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Music Generator API</h2>
    <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Try: "generate happy in urdu" or "english sad music"</p>
    
    <input type="text" id="chatInput" placeholder="Type your prompt here...">
    <button onclick="generateMusic()">Generate Music</button>

    <div class="result-box" id="resultBox">
        <strong style="color: #aaa;">Input Chat:</strong> <span id="chatRes"></span> <br><br>
        <strong>🎵 Output Link:</strong> <a id="musicLink" href="#" target="_blank">Click here to open music</a>
    </div>
</div>

<script>
    async function generateMusic() {
        const chatText = document.getElementById('chatInput').value;
        const resultBox = document.getElementById('resultBox');
        const chatRes = document.getElementById('chatRes');
        const musicLink = document.getElementById('musicLink');

        if (!chatText.trim()) {
            alert("Please type something first!");
            return;
        }

        try {
            const response = await fetch('/mt/king/api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ chat: chatText })
            });

            const data = await response.json();

            if (data.status === 'success') {
                chatRes.innerText = data.chat_received;
                musicLink.href = data.music_url;
                musicLink.innerText = data.music_url;
                resultBox.style.display = 'block';
            } else {
                alert("API returned an error.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Could not connect to the API server.");
        }
    }
</script>

</body>
</html>
