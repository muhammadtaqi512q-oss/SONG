name: Build TAQI Browser Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore

    - name: Build Single-File Standalone EXE
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/

    - name: Upload TAQI Browser EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaqiBrowser-Windows-Executable
        path: publish/TaqiBrowser.exe
