name: Build TAQI Browser APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build App
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.taqi.browser "TAQI Browser"
          
          # 2. Copy all web assets to www folder
          cp -r *.html *.png *.jpg *.jpeg *.css *.js app/www/ 2>/dev/null || true
          
          # 3. Handle icon if available
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi

          cd app
          
          # 4. Add Android platform
          cordova platform add android
          
          # 5. Add required Cordova plugins for browsing & permissions
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-media
          cordova plugin add cordova-plugin-media-capture
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-android-permissions
          
          # Inject permissions into AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' platforms/android/app/src/main/AndroidManifest.xml
          
          # 6. Build Debug APK
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAQI-Browser-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
