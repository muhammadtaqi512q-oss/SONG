name: Build TAQI Browser APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Android APK
        run: |
          npm install -g cordova
          
          # 1. Create Cordova Application
          cordova create app com.taqi.browser "TAQI Browser"
          
          # 2. Copy Web Files
          cp -r *.html *.png *.jpg *.jpeg *.css *.js app/www/ 2>/dev/null || true
          
          # 3. Add Custom App Icon (If icon.png exists in repo root)
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi

          cd app
          
          # 4. Add Android Platform
          cordova platform add android
          
          # 5. Add Required Plugins for Native Browsing & Media
          cordova plugin add cordova-plugin-inappbrowser
          cordova plugin add cordova-plugin-media
          cordova plugin add cordova-plugin-media-capture
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-android-permissions
          
          # 6. Inject Full Web & Media Permissions into AndroidManifest
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' platforms/android/app/src/main/AndroidManifest.xml
          
          # 7. Compile Debug APK
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAQI-Browser-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
