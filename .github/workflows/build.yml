name: Build TAQI Browser Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer Cython==0.29.33

    - name: Initialize Buildozer Config
      run: |
        if [ ! -f "buildozer.spec" ]; then
          buildozer init
        fi

    - name: Configure buildozer.spec for TAQI Browser
      run: |
        sed -i 's/#title =.*/title = TAQI Browser/' buildozer.spec
        sed -i 's/#package.name =.*/package.name = taqibrowser/' buildozer.spec
        sed -i 's/#package.domain =.*/package.domain = org.taqi/' buildozer.spec
        sed -i 's/#source.include_exts =.*/source.include_exts = py,png,jpg,kv,atlas,html,ico/' buildozer.spec
        sed -i 's/#requirements =.*/requirements = python3,kivy,pywebview,pyjnius/' buildozer.spec
        sed -i 's/#orientation =.*/orientation = portrait/' buildozer.spec
        sed -i 's/#fullscreen =.*/fullscreen = 0/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TaqiBrowser-Android-APK
        path: bin/*.apk
